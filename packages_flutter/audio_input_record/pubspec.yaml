name: tekartik_audio_input_record
version: 0.1.0
description: >-
  The microphone as a tekartik_audio_input AudioInput in Flutter, through
  the record package: 16 bit PCM to floats, no automatic gain, permission
  and failure errors, input devices.
publish_to: none
environment:
  sdk: ^3.12.0
  flutter: ">=3.35.0"
dependencies:
  flutter:
    sdk: flutter
  record: ">=7.1.2"
  tekartik_audio_input:
    git:
      url: https://github.com/tekartikprj/audio
      path: packages/audio_input
    version: '>=0.1.0'
dev_dependencies:
  flutter_test:
    sdk: flutter
  # A fake platform in the tests.
  record_platform_interface: ">=2.1.0"
  tekartik_lints_flutter:
    git:
      url: https://github.com/tekartik/common_flutter.dart
      path: packages/lints_flutter
resolution: workspace
