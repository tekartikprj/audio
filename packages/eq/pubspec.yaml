name: tekartik_audio_eq
version: 0.1.0
description: >-
  Parametric equalizer in pure Dart: bands (gain, frequency, Q), RBJ biquad
  coefficients, response curve, a reference processor, presets, PipeWire
  filter-chain and Web Audio forms.
publish_to: none
environment:
  sdk: ^3.12.0
dependencies:
  args: ">=2.6.0"
  tekartik_wav:
    git:
      url: https://github.com/tekartikprj/audio
      path: packages/wav
    version: '>=0.1.0'
dev_dependencies:
  tekartik_audio_play:
    git:
      url: https://github.com/tekartikprj/audio
      path: packages/audio_play
    version: ">=0.1.0"
  tekartik_common_build:
    git:
      url: https://github.com/tekartik/app_build.dart
      path: packages/common_build
  path: ">=1.9.0"
  test: ">=1.31.0"
  tekartik_lints:
    git:
      url: https://github.com/tekartik/common.dart
      path: packages/lints
executables:
  eq_wav:
resolution: workspace
