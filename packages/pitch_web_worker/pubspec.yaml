name: tekartik_pitch_web_worker
version: 0.1.0
description: >-
  tekartik_pitch analyses off the main thread: in a web worker on the web
  (the script built by the setup step), in an isolate on io, on the main
  thread as a fallback.
publish_to: none
environment:
  sdk: ^3.12.0
dependencies:
  tekartik_pitch:
    git:
      url: https://github.com/tekartikprj/audio
      path: packages/pitch
    version: '>=0.1.0'
  tekartik_web_worker_build:
    git:
      url: https://github.com/tekartik/app_build.dart
      path: packages/web_worker_build
    version: '>=0.1.0'
  web: ">=1.1.0"
dev_dependencies:
  # run_ci runs the browser tests of the packages depending on it.
  build_web_compilers: ">=4.7.0"
  test: ">=1.31.0"
  tekartik_lints:
    git:
      url: https://github.com/tekartik/common.dart
      path: packages/lints
executables:
  setup:
resolution: workspace
