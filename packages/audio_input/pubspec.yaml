name: tekartik_audio_input
version: 0.1.0
description: >-
  Audio input abstraction in pure Dart: mono Float32 chunks from a
  microphone, a WAV file or samples, with states and a push input for tests.
publish_to: none
environment:
  sdk: ^3.12.0
dependencies:
  tekartik_wav:
    git:
      url: https://github.com/tekartikprj/audio
      path: packages/wav
    version: '>=0.1.0'
dev_dependencies:
  test: ">=1.31.0"
  tekartik_pitch:
    git:
      url: https://github.com/tekartikprj/audio
      path: packages/pitch
    version: '>=0.1.0'
  tekartik_lints:
    git:
      url: https://github.com/tekartik/common.dart
      path: packages/lints
resolution: workspace
